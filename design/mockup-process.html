<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process 3, Bravo platform, Triage</title>
<style>
/* Triage design tokens.
 *
 * Fonts: Atkinson Hyperlegible Next for everything, Atkinson Hyperlegible Mono
 * only inside the YAML editor. In React prefer the <link> in index.html over
 * this @import so the font request starts before the CSS parses:
 *
 * <link rel="preconnect" href="https://fonts.googleapis.com">
 * <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 * <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap" rel="stylesheet">
 */
@import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap");

:root {
  color-scheme: light;

  /* Base palette, light. Neutrals derive from RAL 7035 (enclosure grey) and
     RAL 7016 (anthracite); interaction is RAL 5005 (signal blue). */
  --plane: #e9ece9;          /* page background, enclosure grey */
  --surface: #f8f9f7;        /* panels, table body */
  --surface-sunk: #eff1ee;   /* table header, code, badges */
  --ink: #22292b;            /* anthracite, primary text */
  --ink-2: #4b5558;          /* secondary text */
  --ink-3: #5d676a;          /* muted text; AA on plane, surface and sunk */
  --rule: #d5dad7;           /* hairline dividers, decorative only */
  --rule-strong: #7f8987;    /* input and control boundaries, 3:1 */
  --signal: #1f4f8f;         /* links, primary buttons, focus, selection */
  --signal-ink: #ffffff;     /* text on --signal */
  --signal-wash: #e1e9f4;    /* selected row */

  /* Semantic. Never decorative; always paired with an icon and a word. */
  --ok: #1d6e45;             /* approved, validation passed */
  --ok-wash: #e2efe7;
  --danger: #a3164f;         /* rejected, validation failed; crimson, kept clear of the urgency ramp */
  --danger-wash: #f6e3ea;

  /* Urgency bands. The only warm colour in the product. One hue (safety
     orange), ordered by distance from the surface: today sits furthest from
     the page in both themes, so the same band is rust here and peach in dark.
     Validated with the dataviz ordinal checks against --surface. */
  --band-today: #9d2800;
  --band-today-ink: #ffffff;
  --band-week: #be4500;
  --band-week-ink: #ffffff;
  --band-month: #d36c1b;
  --band-month-ink: #1a2023;
  --band-shutdown: #d58d52;
  --band-shutdown-ink: #1a2023;
  --band-backlog: #d3ab85;
  --band-backlog-ink: #1a2023;

  /* Type */
  --font-ui: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --font-code: "Atkinson Hyperlegible Mono", ui-monospace, monospace;

  --fs-xs: 0.75rem;   --lh-xs: 1rem;        /* 12/16 badges, table meta */
  --fs-sm: 0.8125rem; --lh-sm: 1.125rem;    /* 13/18 secondary, table cells */
  --fs-base: 0.9375rem; --lh-base: 1.4rem;  /* 15/22.4 body, rationale */
  --fs-md: 1.0625rem; --lh-md: 1.5rem;      /* 17/24 panel headings, band strips */
  --fs-lg: 1.25rem;   --lh-lg: 1.625rem;    /* 20/26 screen titles, tag in detail */
  --fs-xl: 1.5rem;    --lh-xl: 1.875rem;    /* 24/30 score numerals */
  --fs-2xl: 2rem;     --lh-2xl: 2.25rem;    /* 32/36 rare */
  --fs-num: 3rem;     --lh-num: 1;          /* 48 urgency numeral in detail */

  --fw-regular: 400;
  --fw-medium: 560;
  --fw-bold: 700;
  --fw-heavy: 780;   /* numerals only */

  --measure: 68ch;   /* prose line length */

  /* Space, 4px base */
  --sp-1: 0.125rem;  /* 2 */
  --sp-2: 0.25rem;   /* 4 */
  --sp-3: 0.5rem;    /* 8 */
  --sp-4: 0.75rem;   /* 12 */
  --sp-5: 1rem;      /* 16 */
  --sp-6: 1.5rem;    /* 24 */
  --sp-7: 2rem;      /* 32 */
  --sp-8: 3rem;      /* 48 */
  --sp-9: 4rem;      /* 64 */

  /* Radius by role, not one radius everywhere */
  --r-strip: 0;      /* table rows, band strips */
  --r-chip: 3px;     /* chips, badges, score cells */
  --r-control: 6px;  /* buttons, inputs */
  --r-panel: 10px;   /* panels, sheets, dialogs */

  --shadow-overlay: 0 8px 24px rgb(34 41 43 / 0.18), 0 1px 3px rgb(34 41 43 / 0.12);

  --hit: 2.75rem;    /* 44px minimum touch target */
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--signal);

  --dur-1: 120ms;
  --dur-2: 200ms;
  --dur-3: 320ms;            /* layout moves on the lane grid, progress bar */
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #1a2023;
    --surface: #1e2427;
    --surface-sunk: #262e31;
    --ink: #e6e9e6;
    --ink-2: #b4bdbc;
    --ink-3: #929c9d;
    --rule: #333c3f;
    --rule-strong: #6f797c;
    --signal: #8fb6ee;
    --signal-ink: #10243f;
    --signal-wash: #223246;
    --ok: #72c99d;
    --ok-wash: #1d3329;
    --danger: #f28fb4;
    --danger-wash: #3d2330;
    --band-today: #ffac5a;
    --band-today-ink: #1a2023;
    --band-week: #f68e40;
    --band-week-ink: #1a2023;
    --band-month: #de7133;
    --band-month-ink: #1a2023;
    --band-shutdown: #af5b39;
    --band-shutdown-ink: #ffffff;
    --band-backlog: #824c39;
    --band-backlog-ink: #ffffff;
    --shadow-overlay: 0 8px 24px rgb(0 0 0 / 0.45), 0 1px 3px rgb(0 0 0 / 0.35);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #1a2023;
  --surface: #1e2427;
  --surface-sunk: #262e31;
  --ink: #e6e9e6;
  --ink-2: #b4bdbc;
  --ink-3: #929c9d;
  --rule: #333c3f;
  --rule-strong: #6f797c;
  --signal: #8fb6ee;
  --signal-ink: #10243f;
  --signal-wash: #223246;
  --ok: #72c99d;
  --ok-wash: #1d3329;
  --danger: #f28fb4;
  --danger-wash: #3d2330;
  --band-today: #ffac5a;
  --band-today-ink: #1a2023;
  --band-week: #f68e40;
  --band-week-ink: #1a2023;
  --band-month: #de7133;
  --band-month-ink: #1a2023;
  --band-shutdown: #af5b39;
  --band-shutdown-ink: #ffffff;
  --band-backlog: #824c39;
  --band-backlog-ink: #ffffff;
  --shadow-overlay: 0 8px 24px rgb(0 0 0 / 0.45), 0 1px 3px rgb(0 0 0 / 0.35);
}

:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Shared components */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  font-weight: var(--fw-regular);
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--signal); text-underline-offset: 0.18em; }
abbr[title] { text-decoration: none; }
.i { width: 1em; height: 1em; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: var(--sp-3); top: -3rem; background: var(--signal); color: var(--signal-ink); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-control); z-index: 10; }
.skip:focus { top: var(--sp-3); }

/* Top bar with the readiness strip */
.topbar {
  display: flex; align-items: center; gap: var(--sp-6);
  padding: 0 var(--sp-6);
  min-height: 3.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.wordmark { font-weight: var(--fw-heavy); font-size: var(--fs-md); letter-spacing: -0.01em; }
.ws {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: var(--hit); padding: 0 var(--sp-3);
  background: none; border: 0; border-radius: var(--r-control);
  font-weight: var(--fw-medium); cursor: pointer;
}
.ws:hover { background: var(--surface-sunk); }
.ready { display: flex; align-items: center; gap: var(--sp-5); margin-left: auto; }
.ready__step { display: flex; align-items: center; gap: var(--sp-3); color: var(--ink-3); }
.ready__step + .ready__step::before {
  content: ""; width: var(--sp-6); height: 1px; background: var(--rule-strong); margin-right: var(--sp-2);
}
.ready__n {
  display: grid; place-items: center;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 1.5px solid currentColor;
  font-size: var(--fs-xs); font-weight: var(--fw-bold);
}
.ready__step.is-done { color: var(--ink); }
.ready__step.is-done .ready__n { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.ready__step.is-current .ready__t { font-weight: var(--fw-bold); }
.ready__t { display: flex; flex-direction: column; font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-medium); }
.ready__s { font-weight: var(--fw-regular); color: var(--ink-3); font-size: var(--fs-xs); line-height: var(--lh-xs); }
.iconbtn {
  display: inline-grid; place-items: center;
  width: var(--hit); height: var(--hit);
  background: none; border: 0; border-radius: var(--r-control); color: var(--ink-2); cursor: pointer;
}
.iconbtn:hover { background: var(--surface-sunk); color: var(--ink); }

/* Buttons. Never warm: orange belongs to urgency. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-3);
  min-height: var(--hit); padding: 0 var(--sp-5);
  border-radius: var(--r-control); border: 1px solid transparent;
  font-weight: var(--fw-bold); font-size: var(--fs-base); cursor: pointer;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.btn--primary { background: var(--signal); color: var(--signal-ink); }
.btn--primary:hover { background: color-mix(in oklab, var(--signal) 88%, var(--ink)); }
.btn--secondary { background: var(--surface); border-color: var(--rule-strong); color: var(--ink); }
.btn--secondary:hover { background: var(--surface-sunk); }
.btn--quiet { background: transparent; border-color: var(--rule-strong); color: var(--ink); }
.btn--quiet:hover { background: var(--surface-sunk); }

/* SCE: the one badge that is always filled, because it is the primary review trigger */
.sce {
  display: inline-flex; align-items: center;
  padding: 0 var(--sp-2); height: 1.125rem;
  border-radius: var(--r-chip);
  background: var(--ink); color: var(--surface);
  font-size: var(--fs-xs); font-weight: var(--fw-bold); letter-spacing: 0.02em;
  line-height: 1;
}

/* Equipment tags and ids: same family, heavier, tabular */
.tag { font-weight: var(--fw-bold); letter-spacing: 0.005em; }
.tid { font-size: var(--fs-sm); color: var(--ink-2); text-decoration: none; }
.tid:hover { color: var(--signal); text-decoration: underline; }

/* Filter chips */
.fchip {
  display: inline-flex; align-items: center; gap: var(--sp-3);
  min-height: 2.25rem; padding: 0 var(--sp-4);
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--r-control);
  font-size: var(--fs-sm); font-weight: var(--fw-medium); cursor: pointer;
}
.fchip:hover { background: var(--surface-sunk); }
.fchip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--surface-sunk); }
.fchip__n { color: var(--ink-3); font-weight: var(--fw-regular); }
.swatch { width: 0.75rem; height: 0.75rem; border-radius: 2px; }
.swatch--today, .ucell--today, .dist__seg--today, .nl__seg--today { background: var(--band-today); color: var(--band-today-ink); }
.swatch--week, .ucell--week, .dist__seg--week, .nl__seg--week { background: var(--band-week); color: var(--band-week-ink); }
.swatch--month, .ucell--month, .dist__seg--month, .nl__seg--month { background: var(--band-month); color: var(--band-month-ink); }
.swatch--shutdown, .ucell--shutdown, .dist__seg--shutdown, .nl__seg--shutdown { background: var(--band-shutdown); color: var(--band-shutdown-ink); }
.swatch--backlog, .ucell--backlog, .dist__seg--backlog, .nl__seg--backlog { background: var(--band-backlog); color: var(--band-backlog-ink); }

.select select, .search input {
  min-height: 2.25rem; padding: 0 var(--sp-4);
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--r-control);
  font-size: var(--fs-sm);
}
.search { position: relative; display: inline-flex; align-items: center; }
.search .i { position: absolute; left: var(--sp-3); color: var(--ink-3); }
.search input { padding-left: 2rem; width: 13rem; }
.search input::placeholder, textarea::placeholder { color: var(--ink-3); }

.prose { max-width: var(--measure); color: var(--ink); }
kbd {
  display: inline-grid; place-items: center; min-width: 1.25rem; height: 1.25rem; padding: 0 var(--sp-1);
  border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: var(--r-chip);
  font: inherit; font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--ink-2);
}


/* ---- Components added for the workspace steps, the process view and login ---- */

/* The readiness strip becomes the step navigation. Each step is a link; a
   locked step is a disabled button with its reason underneath. */
.ready__step { text-decoration: none; }
a.ready__step, button.ready__step {
  min-height: var(--hit); padding: 0 var(--sp-2); margin: 0 calc(-1 * var(--sp-2));
  border: 0; background: none; border-radius: var(--r-control); cursor: pointer;
}
a.ready__step:hover { background: var(--surface-sunk); }
.ready li { display: flex; align-items: center; gap: var(--sp-5); }
.ready li + li::before { content: ""; width: var(--sp-6); height: 1px; background: var(--rule-strong); }
.ready__step.is-locked { cursor: not-allowed; color: var(--ink-3); }
.ready__step.is-locked .ready__n { border-style: dashed; }
.ready__step.is-current .ready__n { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
.ready__step.is-stale .ready__n { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.ready__s .i { width: 0.75rem; height: 0.75rem; vertical-align: -0.1em; margin-right: 2px; }
.ready__s.is-danger { color: var(--danger); font-weight: var(--fw-medium); }

/* Status badge: the ticketing-system cue. Outline only, always icon plus word.
   Ink means the machine finished, ok means a human approved or a check passed,
   danger means it failed. No fills, so nothing competes with a band. */
.status {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: 1.5rem; padding: 0 var(--sp-3) 0 var(--sp-2);
  border: 1px solid var(--rule-strong); border-radius: var(--r-chip);
  font-size: var(--fs-xs); line-height: var(--lh-xs); font-weight: var(--fw-bold);
  color: var(--ink); background: var(--surface); white-space: nowrap;
}
.status .i { width: 0.875rem; height: 0.875rem; }
.status--muted { color: var(--ink-3); border-style: dashed; font-weight: var(--fw-medium); }
.status--ok { color: var(--ok); }
.status--danger { color: var(--danger); }
.status--lg { min-height: 1.75rem; font-size: var(--fs-sm); padding: 0 var(--sp-4) 0 var(--sp-3); }

/* Running marker. The arc turns while work is in flight; under reduced motion
   it stops and the word beside it still says Running. */
.spin { animation: spin 0.9s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* Page head shared by the step and process screens */
.phead { padding: var(--sp-6) var(--sp-7) var(--sp-5); display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--sp-4) var(--sp-6); }
.phead h1 { font-size: var(--fs-lg); line-height: var(--lh-lg); font-weight: var(--fw-bold); display: flex; align-items: center; gap: var(--sp-4); }
.phead__meta { color: var(--ink-2); font-size: var(--fs-sm); line-height: var(--lh-sm); margin-top: var(--sp-2); max-width: 72ch; }
.phead__actions { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
.crumb { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--ink-2); text-decoration: none; margin-bottom: var(--sp-2); }
.crumb:hover { color: var(--signal); text-decoration: underline; }

/* Event ladder: one row per event, a rail through the icons. Built straight from
   {ts, stage, status, title, detail}. */
.ladder { display: grid; position: relative; }
.ev { display: grid; grid-template-columns: 4.25rem 1.5rem minmax(0, 1fr); column-gap: var(--sp-3); position: relative; padding-bottom: var(--sp-4); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.ev::before { content: ""; position: absolute; left: calc(4.25rem + var(--sp-3) + 0.75rem - 0.5px); top: 1.375rem; bottom: 0; width: 1px; background: var(--rule-strong); }
.ev:last-child::before { display: none; }
.ev__t { text-align: right; color: var(--ink-3); font-size: var(--fs-xs); padding-top: 2px; }
.ev__i { display: grid; place-items: center; width: 1.5rem; height: 1.25rem; position: relative; z-index: 1; }
.ev__i .i { width: 1rem; height: 1rem; background: var(--surface); border-radius: 50%; }
.ev__b { min-width: 0; }
.ev__title { font-weight: var(--fw-bold); color: var(--ink); }
.ev__stage { font-weight: var(--fw-regular); color: var(--ink-3); margin-right: var(--sp-2); }
.ev__d { color: var(--ink-2); margin-top: var(--sp-1); max-width: var(--measure); }
.ev--done .ev__i { color: var(--ink); }
.ev--pass .ev__i { color: var(--ok); }
.ev--fail .ev__i { color: var(--danger); }
.ev--fail .ev__title { color: var(--danger); }
.ev--start .ev__i, .ev--info .ev__i { color: var(--ink-2); }
.ev--pending { padding-bottom: var(--sp-3); }
.ev--pending .ev__i, .ev--pending .ev__title { color: var(--ink-3); font-weight: var(--fw-medium); }
.ev--pending::before { background: none; border-left: 1px dashed var(--rule-strong); }
.ev--live .ev__title::after { content: ""; }
.kv { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-5); margin-top: var(--sp-1); color: var(--ink-2); }
.kv b { color: var(--ink); font-weight: var(--fw-bold); }
.err { display: block; margin-top: var(--sp-2); padding: var(--sp-2) var(--sp-3); background: var(--surface-sunk); border-radius: var(--r-chip); font-family: var(--font-code); font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink); overflow-wrap: anywhere; }
.subchecks { display: grid; gap: var(--sp-2); margin-top: var(--sp-2); }
.subcheck { display: grid; grid-template-columns: 1rem minmax(0, 1fr); gap: var(--sp-2); }
.subcheck .i { margin-top: 1px; }
.subcheck.is-pass .i { color: var(--ok); }
.subcheck.is-fail .i { color: var(--danger); }
.subcheck.is-fail b { color: var(--danger); }
.subcheck span { color: var(--ink-2); }
.tail { margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4); background: var(--surface-sunk); border-radius: var(--r-chip); font-family: var(--font-code); font-size: var(--fs-xs); line-height: 1.25rem; color: var(--ink-2); white-space: pre-wrap; overflow: hidden; position: relative; max-width: 72ch; }
.tail::after { content: ""; display: inline-block; width: 0.5em; height: 1em; vertical-align: -0.15em; background: var(--ink); animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tail::after { animation: none; } }

/* Progress meter: ink on a lighter step of the same neutral. Never orange, never blue. */
.prog { height: 0.375rem; background: var(--rule); border-radius: 3px; overflow: hidden; }
.prog__fill { height: 100%; background: var(--ink); border-radius: 3px; transition: width var(--dur-3) var(--ease); }

/* Tabs */
.tabs { display: flex; gap: var(--sp-5); padding: 0 var(--sp-7); border-bottom: 1px solid var(--rule); }
.tab { position: relative; display: inline-flex; align-items: center; gap: var(--sp-2); min-height: var(--hit); padding: 0 var(--sp-1); background: none; border: 0; color: var(--ink-2); font-weight: var(--fw-medium); text-decoration: none; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: var(--fw-bold); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--signal); border-radius: 2px 2px 0 0; }
.tab__n { font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--ink-2); background: var(--surface-sunk); border-radius: var(--r-chip); padding: 0 var(--sp-2); min-width: 1.5rem; text-align: center; }

/* Panels, fields */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-panel); }
.field { display: grid; gap: var(--sp-2); }
.field label, .field__label { font-size: var(--fs-sm); font-weight: var(--fw-bold); }
.input, .textarea, .selectbox {
  min-height: var(--hit); padding: 0 var(--sp-4);
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--r-control);
  font-size: var(--fs-base); color: var(--ink); width: 100%;
}
.textarea { padding: var(--sp-3) var(--sp-4); line-height: var(--lh-base); resize: vertical; }
.input[aria-invalid="true"] { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.ferr { display: flex; gap: var(--sp-2); align-items: flex-start; color: var(--danger); font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-medium); }
.ferr .i { margin-top: 2px; }
.btn--sm { min-height: 2.25rem; padding: 0 var(--sp-4); font-size: var(--fs-sm); }
.btn[disabled], .btn[aria-disabled="true"] { cursor: not-allowed; background: var(--surface-sunk); border-color: var(--rule); color: var(--ink-3); }
.vstr { font-family: var(--font-code); font-size: var(--fs-xs); background: var(--surface-sunk); padding: var(--sp-1) var(--sp-2); border-radius: var(--r-chip); white-space: nowrap; color: var(--ink); }
.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }

/* Toast, used for undo and decisions */
.toast { position: fixed; right: var(--sp-6); bottom: var(--sp-6); z-index: 20; display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-5); background: var(--ink); color: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow-overlay); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.toast .btn { min-height: 2.25rem; background: transparent; color: var(--surface); border-color: color-mix(in oklab, var(--surface) 55%, transparent); font-size: var(--fs-sm); }

/* Band score cell, reused from the tickets list */
.ucell { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: var(--r-chip); font-size: var(--fs-md); font-weight: var(--fw-heavy); }
.ucell--sm { width: 1.75rem; height: 1.75rem; font-size: var(--fs-base); }
.ucell--today { background: var(--band-today); color: var(--band-today-ink); }
.ucell--week { background: var(--band-week); color: var(--band-week-ink); }
.ucell--month { background: var(--band-month); color: var(--band-month-ink); }
.ucell--shutdown { background: var(--band-shutdown); color: var(--band-shutdown-ink); }
.ucell--backlog { background: var(--band-backlog); color: var(--band-backlog-ink); }

@media (max-width: 60rem) {
  .topbar { flex-wrap: wrap; gap: var(--sp-3); padding: 0 var(--sp-4); }
  .ready { order: 3; width: 100%; margin: 0; padding: var(--sp-1) 0 var(--sp-2); justify-content: space-between; gap: var(--sp-1); }
  .ready li { gap: 0; }
  .ready li + li::before { display: none; }
  .ready__s { display: none; }
  .themebtn { margin-left: auto; }
  .phead { padding: var(--sp-5) var(--sp-4) var(--sp-4); }
  .tabs { padding: 0 var(--sp-4); }
  .ev { grid-template-columns: 3.25rem 1.5rem minmax(0, 1fr); }
  .ev::before { left: calc(3.25rem + var(--sp-3) + 0.75rem - 0.5px); }
  .toast { left: var(--sp-4); right: var(--sp-4); bottom: var(--sp-4); }
}
.topbar nav { margin-left: auto; }
@media (max-width: 60rem) { .topbar nav { order: 3; width: 100%; margin: 0; } }
a.btn { text-decoration: none; }
button.ready__step { text-align: left; font: inherit; color: var(--ink-3); }

/* ---- Process page ---- */
.proc { background: var(--plane); min-height: calc(100vh - 3.5rem); }
.pwrap { background: var(--surface); border-bottom: 1px solid var(--rule); }
.stats { display: flex; flex-wrap: wrap; gap: var(--sp-4) var(--sp-7); align-items: flex-start; padding: 0 var(--sp-7); }
.stat dt { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-2); font-weight: var(--fw-medium); }
.stat dd { font-size: var(--fs-xl); line-height: var(--lh-xl); font-weight: var(--fw-heavy); display: flex; align-items: baseline; gap: var(--sp-2); }
.stat dd small { font-size: var(--fs-sm); font-weight: var(--fw-regular); color: var(--ink-3); }
.stat--fail dd { color: var(--danger); }
.stat--fail dd .i { width: 1rem; height: 1rem; align-self: center; }
.stat--zero dd { color: var(--ink-3); }
.pprog { padding: var(--sp-4) var(--sp-7) var(--sp-5); display: grid; gap: var(--sp-2); max-width: 64rem; }
.pprog__cap { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-2); display: flex; justify-content: space-between; gap: var(--sp-4); }
.dist { display: flex; gap: 2px; height: 0.5rem; }
.dist span { border-radius: 2px; min-width: 0.5rem; }
.dist-legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-2); }
.dist-legend span { display: inline-flex; align-items: center; gap: var(--sp-2); }
.dist-legend b { color: var(--ink); }
.sw { width: 0.75rem; height: 0.75rem; border-radius: 2px; }
.bg-today { background: var(--band-today); } .bg-week { background: var(--band-week); } .bg-month { background: var(--band-month); } .bg-shutdown { background: var(--band-shutdown); } .bg-backlog { background: var(--band-backlog); }

.pfilters { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; padding: var(--sp-5) var(--sp-7) var(--sp-4); }
.pfilters__note { margin-left: auto; font-size: var(--fs-xs); color: var(--ink-3); }

/* The stage matrix: lanes are rows, stages are columns. Header and lanes share one grid. */
.matrix { --cols: 2.25rem 5.25rem 11.5rem repeat(9, minmax(3.5rem, 1fr)) 10.5rem 8.25rem; margin: 0 var(--sp-7) var(--sp-8); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-panel); }
.mhead { display: grid; grid-template-columns: var(--cols); position: sticky; top: 0; z-index: 3; background: var(--surface-sunk); border-bottom: 1px solid var(--rule); border-radius: var(--r-panel) var(--r-panel) 0 0; }
.mhead > div { padding: var(--sp-4) var(--sp-2) var(--sp-3); font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-2); font-weight: var(--fw-medium); align-self: end; }
.mhead .h-lane { grid-column: 1 / span 3; padding-left: var(--sp-5); align-self: stretch !important; display: flex; flex-direction: column; justify-content: space-between; gap: var(--sp-4); }
.legend { display: grid; gap: var(--sp-2); color: var(--ink-2); font-weight: var(--fw-regular); }
.legend li { display: flex; align-items: center; gap: var(--sp-3); }
.legend .i { width: 0.875rem; height: 0.875rem; color: var(--ink); }
.lg { width: 0.875rem; height: 0.875rem; display: grid; place-items: center; }
.lg--past::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ink); box-shadow: -0.5rem 0 0 -0.125rem var(--ink), 0.5rem 0 0 -0.125rem var(--ink); }
.lg-x { display: inline-flex; align-items: center; color: var(--danger); font-weight: var(--fw-bold); font-size: 0.625rem; width: 0.875rem; }
.lg-x .i { width: 0.625rem; height: 0.625rem; color: var(--danger); }
.stg { position: relative; display: grid; align-content: start; gap: var(--sp-1); align-self: stretch !important; }
.stg__top { display: flex; align-items: center; justify-content: center; position: relative; height: 1.5rem; margin-bottom: var(--sp-2); }
.stg__top::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule-strong); }
.stg:first-of-type .stg__top::before { left: 50%; }
.stg:nth-of-type(9) .stg__top::before { right: 50%; }
.stg__n { position: relative; display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1.5px solid var(--ink-3); background: var(--surface-sunk); color: var(--ink-2); font-size: var(--fs-xs); font-weight: var(--fw-bold); }
.stg.is-complete .stg__n { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.stg.is-active .stg__n { border-color: var(--ink); color: var(--ink); }
.stg__name { text-align: center; font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-bold); color: var(--ink); }
.stg__count { text-align: center; color: var(--ink-2); }
.stg__count b { color: var(--ink); font-weight: var(--fw-bold); }
.stg__now { display: grid; justify-items: center; gap: 2px; margin-top: var(--sp-1); }
.stg__now span { display: inline-flex; align-items: center; gap: 3px; padding: 0 var(--sp-2); border-radius: var(--r-chip); background: var(--surface); border: 1px solid var(--rule-strong); color: var(--ink); font-weight: var(--fw-bold); }
.stg__now .i { width: 0.7rem; height: 0.7rem; }
.stg__wait { text-align: center; color: var(--ink-3); }
.mhead .h-st, .mhead .h-tk { padding-left: var(--sp-4); }

.lane { border-bottom: 1px solid var(--rule); }
.lane:last-child { border-bottom: 0; }
.lane__row { display: grid; grid-template-columns: var(--cols); align-items: center; min-height: 3.25rem; cursor: pointer; }
.lane__row:hover { background: var(--surface-sunk); }
.lane.is-open > .lane__row { background: var(--signal-wash); box-shadow: inset 3px 0 0 var(--signal); }
.lane__x { display: grid; place-items: center; width: 2rem; height: 2rem; margin-left: var(--sp-2); border: 0; background: none; border-radius: var(--r-control); color: var(--ink-2); cursor: pointer; }
.lane__x .i { transition: transform var(--dur-1) var(--ease); }
.lane.is-open .lane__x .i { transform: rotate(90deg); }
.lane__f { font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--ink-2); padding-left: var(--sp-2); }
.lane__eq { display: flex; flex-direction: column; min-width: 0; padding-right: var(--sp-3); }
.lane__eq .tag { display: flex; align-items: center; gap: var(--sp-2); }
.lane__eq small { color: var(--ink-3); font-size: var(--fs-xs); line-height: var(--lh-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane__st { padding-left: var(--sp-4); display: grid; gap: 2px; justify-items: start; }
.lane__st small { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-3); padding-left: var(--sp-2); }
.lane__tk { padding: 0 var(--sp-4); display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-sm); }
.lane__tk .tid { color: var(--ink-2); font-size: var(--fs-sm); white-space: nowrap; }
.lane__tk .failed { color: var(--danger); font-weight: var(--fw-bold); font-size: var(--fs-xs); line-height: var(--lh-xs); }

/* Track cell: a line through every stage, ink up to the lane's head, hairline after. */
.tk { position: relative; height: 2.5rem; display: grid; place-items: center; }
.tk::before, .tk::after { content: ""; position: absolute; top: 50%; height: 1px; margin-top: -0.5px; background: var(--rule-strong); }
.tk::before { left: 0; right: 50%; }
.tk::after { left: 50%; right: 0; }
.tk.is-first::before, .tk.is-last::after, .tk--void::before, .tk--void::after { display: none; }
.tk.in-l::before { height: 3px; margin-top: -1.5px; background: var(--ink); }
.tk.in-r::after { height: 3px; margin-top: -1.5px; background: var(--ink); }
.tk__node { position: relative; z-index: 1; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--rule-strong); }
.tk.is-past .tk__node { background: var(--ink); border-color: var(--ink); }
.tk.is-head .tk__node { display: none; }
.tk__head { position: relative; z-index: 1; display: grid; place-items: center; width: 1.375rem; height: 1.375rem; border-radius: 50%; background: var(--surface); color: var(--ink); }
.tk__head .i { width: 1.375rem; height: 1.375rem; }
.tk__head--wait { color: var(--ink-3); }
.tk__head--fail { color: var(--danger); }
.tk__head--done { background: var(--ink); color: var(--surface); }
.tk__head--done .i { width: 0.875rem; height: 0.875rem; }
.tk__retry { position: absolute; z-index: 2; top: 0.125rem; left: 50%; margin-left: 0.25rem; display: inline-flex; align-items: center; gap: 1px; color: var(--danger); font-size: 0.625rem; line-height: 1; font-weight: var(--fw-bold); }
.tk__retry .i { width: 0.625rem; height: 0.625rem; }
.lane.is-open > .lane__row .tk__node, .lane.is-open > .lane__row .tk__head { background: var(--signal-wash); }
.lane.is-open > .lane__row .tk.is-past .tk__node { background: var(--ink); }
.lane.is-open > .lane__row .tk__head--done { background: var(--ink); }
.lane__row:hover .tk__node, .lane__row:hover .tk__head { background: var(--surface-sunk); }
.lane__row:hover .tk.is-past .tk__node, .lane__row:hover .tk__head--done { background: var(--ink); }
/* Finished lanes settle: the line drops to muted ink so running lanes and the score column carry the eye. */
.lane.is-drafted .tk.in-l::before, .lane.is-drafted .tk.in-r::after { background: var(--ink-3); height: 2px; margin-top: -1px; }
.lane.is-drafted .tk.is-past .tk__node { background: var(--ink-3); border-color: var(--ink-3); }
.lane.is-open.is-drafted .tk.is-past .tk__node, .lane__row:hover .tk.is-past .tk__node { background: var(--ink-3); }
.lane--batch .lane__row { background: var(--surface-sunk); }
.lane--batch .lane__f { color: var(--ink); }
.lane--batch.is-open > .lane__row { background: var(--signal-wash); }
.lane.is-queued .lane__f, .lane.is-queued .tag { color: var(--ink-2); }

/* Expanded lane: ladder on the left, the finding it is working on at the right */
.lane__open { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: var(--sp-7); padding: var(--sp-5) var(--sp-6) var(--sp-6) calc(2.25rem + var(--sp-2)); border-top: 1px solid var(--rule); background: var(--surface); }
.lane__open h3 { font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-bold); color: var(--ink-2); margin-bottom: var(--sp-4); }
.ctx { display: grid; gap: var(--sp-4); align-content: start; font-size: var(--fs-sm); line-height: var(--lh-sm); }
.ctx__q { color: var(--ink); padding-left: var(--sp-4); border-left: 2px solid var(--rule-strong); line-height: 1.25rem; }
.ctx dl { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-2) var(--sp-4); }
.ctx dt { color: var(--ink-3); }
.ctx dd { color: var(--ink); }
.ctx__acts { display: flex; flex-wrap: wrap; gap: var(--sp-3); }

.notes { display: grid; gap: var(--sp-3); margin-top: var(--sp-2); }
.notes b { display: block; color: var(--ink); }
.usteps { display: grid; margin-top: var(--sp-2); border-top: 1px solid var(--rule); max-width: var(--measure); }
.ustep { display: grid; grid-template-columns: 10.5rem minmax(0, 1fr) 2.75rem; gap: 0 var(--sp-4); padding: var(--sp-2) 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.ustep b { font-weight: var(--fw-bold); color: var(--ink); }
.ustep span { color: var(--ink-2); }
.ustep em { font-style: normal; font-weight: var(--fw-heavy); font-size: var(--fs-base); text-align: right; }
.ustep small { margin-left: var(--sp-2); font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
.ustep.is-changed small { color: var(--ink); font-weight: var(--fw-bold); }
.ustep.is-na b, .ustep.is-na em { color: var(--ink-3); font-weight: var(--fw-medium); }
.ufinal { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-3); font-weight: var(--fw-bold); }
.reasons { display: grid; gap: var(--sp-1); margin-top: var(--sp-2); }
.reasons li { display: flex; gap: var(--sp-2); }
.reasons .i { margin-top: 2px; color: var(--ink-2); }

/* Motion demonstrations. Reduced motion collapses them through the shared rule. */
.is-new { animation: evIn var(--dur-2) var(--ease); }
@keyframes evIn { from { opacity: 0; transform: translateY(-4px); } }
.tick { display: inline-block; animation: tickIn var(--dur-1) var(--ease); }
@keyframes tickIn { from { opacity: 0; transform: translateY(40%); } }
.pop { animation: pop var(--dur-2) var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(0.85); } }
.first .tk.in-l::before, .first .tk.in-r::after { transform-origin: left center; animation: sweep var(--dur-3) var(--ease) backwards; animation-delay: calc(var(--i) * 20ms); }
@keyframes sweep { from { transform: scaleX(0); } }

/* Sheet for the rendered prompt */
.scrim { position: fixed; inset: 0; background: rgb(20 26 28 / 0.45); z-index: 30; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(40rem, 100vw); background: var(--surface); z-index: 31; box-shadow: var(--shadow-overlay); display: flex; flex-direction: column; border-radius: var(--r-panel) 0 0 var(--r-panel); }
.sheet header { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-5) var(--sp-6); border-bottom: 1px solid var(--rule); }
.sheet h2 { font-size: var(--fs-md); font-weight: var(--fw-bold); }
.sheet__body { overflow: auto; padding: var(--sp-5) var(--sp-6); display: grid; gap: var(--sp-4); align-content: start; }
.sheet pre { margin: 0; padding: var(--sp-4); background: var(--surface-sunk); border-radius: var(--r-chip); font-family: var(--font-code); font-size: var(--fs-xs); line-height: 1.25rem; white-space: pre-wrap; color: var(--ink); }
.sheet h3 { font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--ink-2); }

.tickets-frame { display: block; width: 100%; height: calc(100vh - 3.5rem); border: 0; }

@media (max-width: 75rem) {
  .matrix { --cols: 2.25rem 5rem 9.5rem repeat(9, minmax(3rem, 1fr)) 9rem 6.5rem; margin: 0 var(--sp-5) var(--sp-8); }
  .stg__name { font-size: var(--fs-xs); }
  .lane__open { grid-template-columns: 1fr; }
}
@media (max-width: 60rem) {
  .stats { padding: 0 var(--sp-4); gap: var(--sp-3) var(--sp-5); }
  .stat dd { font-size: var(--fs-lg); line-height: var(--lh-lg); }
  .pprog { padding: var(--sp-3) var(--sp-4) var(--sp-4); }
  .pfilters { padding: var(--sp-4) var(--sp-4) var(--sp-3); flex-wrap: nowrap; overflow-x: auto; }
  .pfilters .fchip { white-space: nowrap; min-height: var(--hit); }
  .pfilters__note { display: none; }
  .matrix { margin: 0 0 var(--sp-7); border-radius: 0; border-left: 0; border-right: 0; }
  .mhead { display: flex; overflow-x: auto; position: static; border-radius: 0; }
  .mhead .h-lane, .mhead .h-st, .mhead .h-tk { display: none; }
  .mhead .stg { flex: 0 0 6.5rem; }
  .lane__row { grid-template-columns: 2.5rem minmax(0, 1fr) auto; grid-template-areas: "x eq tk" "x track track" "x st st"; row-gap: var(--sp-2); padding: var(--sp-3) var(--sp-4) var(--sp-3) 0; }
  .lane__x { grid-area: x; align-self: start; width: var(--hit); height: var(--hit); margin-left: 0; }
  .lane__f { display: none; }
  .lane__eq { grid-area: eq; }
  .lane__eq .tag::before { content: attr(data-f); font-weight: var(--fw-bold); color: var(--ink-3); font-size: var(--fs-xs); margin-right: var(--sp-1); }
  .lane__track { grid-area: track; display: grid; grid-template-columns: repeat(9, 1fr); }
  .tk { height: 1.5rem; }
  .tk__head, .tk__head .i { width: 1.125rem; height: 1.125rem; }
  .tk__retry { display: none; }
  .lane__st { grid-area: st; padding-left: 0; display: flex; align-items: center; gap: var(--sp-2); }
  .lane__st small { padding: 0; }
  .lane__tk { grid-area: tk; padding: 0; }
  .lane__tk .tid { display: none; }
  .lane__open { padding: var(--sp-4); gap: var(--sp-5); }
  .ustep { grid-template-columns: minmax(0, 1fr) 2.75rem; }
  .ustep span { grid-column: 1 / -1; grid-row: 2; }
  .ustep small { white-space: normal; }
}
@media (min-width: 60.0625rem) { .lane__track { display: contents; } }
</style>

<div id="app"></div>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get("theme")) document.documentElement.dataset.theme = Q.get("theme");
const STILL = Q.has("still");

const P = {
  check: '<path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  cross: '<path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  ring: '<circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".3"/><path class="spin" d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  pending: '<circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.5 2"/>',
  hollow: '<circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>',

const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true">${P[n]}</svg>`;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function status(kind, word, extra = "") {
  const map = {
    running: ["", "ring"], queued: ["status--muted", "pending"], done: ["", "check"],
    ok: ["status--ok", "check"], fail: ["status--danger", "cross"], draft: ["status--muted", "pencil"],
    info: ["", "info"], locked: ["status--muted", "lock"],
  };
  const [cls, icon] = map[kind];
  return `<span class="status ${cls} ${extra}">${ic(icon)}${word}</span>`;
}

function toggleTheme() {
  const r = document.documentElement;
  const dark = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark";
}

/* steps: [{n, label, sub, state: done|current|locked|stale|todo, href, why}] */
function topbar(steps, current) {
  const items = steps.map((s) => {
    const cls = ["ready__step", s.state === "done" ? "is-done" : "", s.n === current ? "is-current" : "",
      s.state === "locked" ? "is-locked" : "", s.state === "stale" ? "is-stale" : ""].join(" ");
    const sub = s.state === "stale" ? `<span class="ready__s is-danger">${ic("cross")}${s.sub}</span>`
      : s.state === "locked" ? `<span class="ready__s">${ic("lock")}${s.sub}</span>`
      : `<span class="ready__s">${s.sub}</span>`;
    const inner = `<span class="ready__n">${s.n}</span><span class="ready__t">${s.label}${sub}</span>`;
    return s.state === "locked"
      ? `<li><button type="button" class="${cls}" aria-disabled="true" title="${s.why}">${inner}</button></li>`
      : `<li><a class="${cls}" href="${s.href}"${s.n === current ? ' aria-current="page"' : ""}>${inner}</a></li>`;
  }).join("");
  return `<header class="topbar">
  <span class="wordmark">Triage</span>
  <button type="button" class="ws">Bravo platform${ic("down")}</button>
  <nav aria-label="Workspace steps"><ol class="ready">${items}</ol></nav>
  <button type="button" class="iconbtn themebtn" onclick="toggleTheme()" aria-label="Switch theme">${ic("theme")}</button>
</header>`;
}

const secs = (t) => t < 60 ? t.toFixed(2) + " s" : `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
function ladder(evs) {
  const icon = { done: "check", pass: "check", fail: "cross", info: "info", start: "ring", pending: "pending", wait: "pending" };
  const cls = { done: "ev--done", pass: "ev--pass", fail: "ev--fail", info: "ev--info", start: "ev--start", pending: "ev--pending", wait: "ev--pending" };
  return `<ol class="ladder">${evs.map((e) => `<li class="ev ${cls[e.status]}">
    <span class="ev__t">${e.ts == null ? "" : secs(e.ts)}</span>
    <span class="ev__i">${ic(icon[e.status])}</span>
    <div class="ev__b"><p class="ev__title"><span class="ev__stage">${e.stage}</span>${e.title}${e.status === "start" ? '<span class="sr-only">, running</span>' : ""}</p>${e.body && e.body.startsWith("<") ? e.body : e.body ? `<p class="ev__d">${e.body}</p>` : ""}</div>
  </li>`).join("")}</ol>`;
}

const bandOf = (u) => BANDS.find((b) => u >= b[2]);

function urgencyOf(fid) {
  const [L, I] = SCORES[fid];
  const sce = EQ[FINDINGS.find((f) => f.id === fid).eq].sce;
  const base = 0.7 * I + 0.3 * L;
  const steps = [{ name: "Weighted base", why: `0.7 × impact ${I} + 0.3 × likelihood ${L}`, val: base.toFixed(1), state: "set" }];
  let v = base;
  const lift = L >= 9 && v < I;
  if (lift) v = I;
  steps.push({ name: "Near-certain lift", why: L >= 9 ? `Likelihood ${L} is at least 9, lifted to impact ${I}` : `Likelihood ${L} is below 9`, val: v.toFixed(1), state: lift ? "changed" : (L >= 9 ? "held" : "na") });
  const cap = I <= 3 && v > 4;
  if (cap) v = 4;
  steps.push({ name: "Inconsequential cap", why: I <= 3 ? `Impact ${I} is at most 3, capped at 4` : `Impact ${I} is above 3`, val: v.toFixed(1), state: cap ? "changed" : (I <= 3 ? "held" : "na") });
  let s = Math.floor(v + 0.5);
  steps.push({ name: "Round", why: "Half rounds up", val: String(s), state: s !== v ? "changed" : "held" });
  const floorApplies = sce && I >= 7;
  const floor = floorApplies && s < 7;
  if (floor) s = 7;
  steps.push({ name: "SCE floor", why: floorApplies ? `Safety Critical Element with impact ${I}, at least 7` : (sce ? `Impact ${I} is below 7` : "Not a Safety Critical Element"), val: String(s), state: floor ? "changed" : (floorApplies ? "held" : "na") });
  const o = OVERRIDES[fid];
  if (o) {
    const changed = s < 9;
    if (changed) s = 9;
    steps.push(o === "pl"
      ? { name: "Override: protection layer impaired, no deviation", why: `Model flagged protection_layer_impaired with deviation_recorded unknown, treated as not recorded. ${EQ[FINDINGS.find((f) => f.id === fid).eq].type} is a protection layer type. At least 9`, val: String(s), state: changed ? "changed" : "held", fired: true }
      : { name: "Override: evacuation below POB", why: "Model flagged evacuation_capacity_reduced and Lifeboat is an evacuation type. POB is not in the data, so the comparison is left to review. At least 9", val: String(s), state: changed ? "changed" : "held", fired: true });
  }
  return { L, I, score: s, band: bandOf(s), steps };
}

  const keep = (l) => filter === "all" || (filter === "retried" ? l.s.retries.length : l.s.kind === filter);
  return `<section class="matrix" aria-label="Pipeline by finding">
    <div class="mhead"><div class="h-lane"><ul class="legend" aria-label="Track key"><li><span class="lg lg--past"></span>Passed</li><li>${ic("ring")}In the stage now</li><li>${ic("pending")}Waiting for a worker</li><li><span class="lg-x">${ic("cross")}1</span>Attempt 1 failed, retried</li></ul>Finding and equipment</div>${stageHead()}<div class="h-st">State</div><div class="h-tk">Ticket</div></div>
    <ol class="lanes ${STATE === "mid" && !STILL ? "first" : ""}">${filter === "all" ? batchHTML() : ""}${lanes.filter(keep).map(laneHTML).join("")}</ol>
  </section>`;
}
function steps() {
  const n = (s) => ({ n: s[0], label: s[1], sub: s[2], state: s[3], href: s[4] });
  return [n([1, "Knowledge", "domain_knowledge.md", "done", "mockup-workspace.html?step=1"]), n([2, "Assets", "18 assets", "done", "mockup-workspace.html?step=2"]),
    n([3, "Rules", "v2 approved", "done", "mockup-workspace.html?step=3&state=versions"]), n([4, "Process", STATE === "mid" ? "Process 3 running" : "3 processes", "done", "mockup-workspace.html?step=4"])];
}
function render() {
  const body = TAB === "tickets"
    ? `<iframe class="tickets-frame" title="Tickets" src="mockup-tickets.html?embed=1${Q.get("theme") ? "&theme=" + Q.get("theme") : ""}"></iframe>`
    : `${filters()}${matrix()}`;
  document.getElementById("app").innerHTML = `${topbar(steps(), 4)}<main class="proc">${header()}${body}</main>`;
}
function toggle(id) { open.has(id) ? open.delete(id) : open.add(id); render(); }
function setFilter(id) { filter = id; render(); }
function sheet(fid) {
  const f = FINDINGS.find((x) => x.id === fid), eq = EQ[f.eq];
  const el = document.createElement("div");
  el.innerHTML = `<div class="scrim" onclick="this.parentNode.remove()"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <header><h2 id="sheet-t">Prompt for ${fid}</h2><span class="muted">attempt 1</span><button type="button" class="iconbtn" style="margin-left:auto" aria-label="Close" onclick="this.closest('aside').parentNode.remove()">${ic("cross")}</button></header>
    <div class="sheet__body">
      <h3>System, 6.1k characters, shared by every finding in this process</h3>
      <pre>You draft triage for a duty integrity engineer on an offshore platform. Score likelihood of failure and impact of failure only; urgency is computed elsewhere. A human approves every ticket.

REGISTRY SCORES
criticality score: 1 to 10, 10 is most critical. Starting point for impact.
reliability score: 1 to 10, 10 is highly reliable. Runs opposite to likelihood; new starters routinely invert it.
...</pre>
      <h3>User, built from the ${eq.type} rules section, the asset and the finding</h3>
      <pre>EQUIPMENT TYPE RULES
- ${eq.type === "Firewater Pump" ? "Failure to start on demand is the scenario the fire protection philosophy is built to avoid." : "One bullet per rule from the " + eq.type + " section."}

EQUIPMENT
id: ${eq.id}
type: ${eq.type}
criticality: ${eq.crit} of 10, where 10 is most critical
reliability: ${eq.rel} of 10, where 10 is highly reliable
safety critical element: ${eq.sce ? "yes" : "no"}
redundancy as written in the registry: ${esc(eq.red)}

BATCH NOTES
${(NOTES[fid] || []).map((x) => "- " + x[1]).join("\n") || "- none"}

FINDING
id: ${f.id}
description: ${esc(f.desc)}</pre>
    </div>
  </aside>`;
  document.body.appendChild(el);
}
render();

/* Live: the clock and in-flight timers tick. The pipeline itself does not advance in the mockup. */
if (STATE === "mid" && TAB === "pipeline" && !STILL) {
  const t0 = performance.now();
  setInterval(() => {
    const now = NOW_MID + (performance.now() - t0) / 1000;
    const c = document.getElementById("clock");
    if (c) c.textContent = clock(now);
    document.querySelectorAll("[data-live]").forEach((el) => { el.textContent = (now - +el.dataset.live).toFixed(1) + " s"; });
  }, 100);
  setTimeout(() => document.querySelector(".lanes")?.classList.remove("first"), 1200);
}
</script>
</body>
</html>
